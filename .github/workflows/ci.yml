name: Validate OpenCookie
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: unpacked-${{ matrix.os }}
          path: release/*-unpacked/**
          if-no-files-found: ignore
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: sudo apt-get update && sudo apt-get install -y python3-gi dbus xdotool
      - run: npm run test:portal
      - run: xvfb-run -a node scripts/desktop-smoke.mjs
      - run: xvfb-run -a node scripts/wayland-desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-evidence
          path: |
            test-results/
            validation-results/
